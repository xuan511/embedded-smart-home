name: checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Portable C controller tests
        env:
          SANITIZE: '1'
        run: python3 tools/test_host.py
  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [default, external]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Host prerequisites
        run: sudo apt-get update -qq && sudo apt-get install -y libusb-1.0-0
      - name: Install pinned S31 preview SDK
        shell: bash
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/espressif/esp-idf.git "$RUNNER_TEMP/esp-idf"
          git -C "$RUNNER_TEMP/esp-idf" checkout d35ea023029363d97c42565f85e0db23486f26b2
          git -C "$RUNNER_TEMP/esp-idf" submodule update --init --recursive --depth 1
          "$RUNNER_TEMP/esp-idf/install.sh" esp32s31
      - name: Build firmware
        shell: bash
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          source "$RUNNER_TEMP/esp-idf/export.sh"
          if [ "$PROFILE" = external ]; then
            idf.py --preview -D SDKCONFIG_DEFAULTS='sdkconfig.defaults;configs/external.defaults' set-target esp32s31
          else
            idf.py --preview set-target esp32s31
          fi
          idf.py --preview build
      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.profile }}
          path: |
            build/*.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/flasher_args.json
            sdkconfig
            dependencies.lock
          retention-days: 14
